<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact — Dinal Dholiya</title>
    <meta name="description" content="Get in touch">
    <link rel="stylesheet" href="styles.css">
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700&family=Space+Grotesk:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="page-inner" data-page="contact">
    <div class="animated-bg calm-bg" aria-hidden="true">
        <div class="gradient-orb orb-1"></div>
        <div class="gradient-orb orb-2"></div>
    </div>
    <div id="site-header"></div>
    <main class="page-main">

        <header class="page-hero reveal">
            <p class="page-eyebrow">Contact</p>
            <h1 class="page-title">Say hello</h1>
            <p class="page-lead">Open to conversations about work, collaboration, or just connecting.</p>
        </header>
        <!-- Contact Section -->
    <section id="contact" class="contact-section page-section">
        <div class="container">
            <div class="contact-content">
                <div class="contact-info">
                    <p class="contact-description">
                        I'm always open to discussing new projects, opportunities, or partnerships. 
                        Feel free to reach out!
                    </p>
                    <div class="contact-methods">
                        <div class="contact-method">
                            <i class="fas fa-envelope"></i>
                            <div>
                                <span class="method-label">Email</span>
                                <span class="method-value">dinaldholiya@gmail.com</span>
                            </div>
                        </div>
                        <div class="contact-method">
                            <i class="fas fa-map-marker-alt"></i>
                            <div>
                                <span class="method-label">Location</span>
                                <span class="method-value">Chicago, IL</span>
                            </div>
                        </div>
                    </div>
                    <div class="social-links">
                        <a href="https://www.linkedin.com/in/dinal-dholiya/" target="_blank" class="social-link">
                            <i class="fab fa-linkedin"></i>
                        </a>
                        <a href="https://github.com/DINAL11" target="_blank" class="social-link">
                            <i class="fab fa-github"></i>
                        </a>
                    </div>
                </div>
                <form
                    class="contact-form"
                    action="https://formsubmit.co/dinaldholiya@gmail.com"
                    method="POST"
                >
                    <input type="hidden" name="_subject" value="New portfolio message">
                    <input type="hidden" name="_captcha" value="false">
                    <input type="hidden" name="_template" value="table">
                    <input type="text" name="_honey" style="display:none" tabindex="-1" autocomplete="off">
                    <div class="form-group">
                        <label for="name">Your Name</label>
                        <input type="text" id="name" name="name" placeholder="John Doe" required>
                    </div>
                    <div class="form-group">
                        <label for="email">Your Email</label>
                        <input type="email" id="email" name="email" placeholder="john@example.com" required>
                    </div>
                    <div class="form-group">
                        <label for="message">Your Message</label>
                        <textarea id="message" name="message" placeholder="Tell me about your project..." rows="5" required></textarea>
                    </div>
                    <p class="form-status" hidden role="status"></p>
                    <button type="submit" class="btn btn-primary submit-btn">
                        <span>Send Message</span>
                        <i class="fas fa-paper-plane"></i>
                    </button>
                </form>
            </div>
        </div>
    </section>

    </main>
    <div id="site-footer"></div>
    <script src="js/site.js" defer></script>

</body>
</html>

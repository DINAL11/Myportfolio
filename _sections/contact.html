<!-- Contact Section -->
    <section id="contact" class="contact-section">
        <div class="container">
            <div class="section-header">
                <span class="section-tag">Let's connect</span>
                <h2 class="section-title">Get In Touch</h2>
            </div>
            <div class="contact-content">
                <div class="contact-info">
                    <p class="contact-description">
                        I'm always open to discussing new projects, opportunities, or partnerships. 
                        Feel free to reach out!
                    </p>
                    <div class="contact-methods">
                        <div class="contact-method">
                            <i class="fas fa-envelope"></i>
                            <div>
                                <span class="method-label">Email</span>
                                <span class="method-value">dinaldholiya@gmail.com</span>
                            </div>
                        </div>
                        <div class="contact-method">
                            <i class="fas fa-map-marker-alt"></i>
                            <div>
                                <span class="method-label">Location</span>
                                <span class="method-value">Chicago, IL</span>
                            </div>
                        </div>
                    </div>
                    <div class="social-links">
                        <a href="https://www.linkedin.com/in/dinal-dholiya/" target="_blank" class="social-link">
                            <i class="fab fa-linkedin"></i>
                        </a>
                        <a href="https://github.com/DINAL11" target="_blank" class="social-link">
                            <i class="fab fa-github"></i>
                        </a>
                    </div>
                </div>
                <form
                    class="contact-form"
                    action="https://formsubmit.co/dinaldholiya@gmail.com"
                    method="POST"
                >
                    <input type="hidden" name="_subject" value="New portfolio message">
                    <input type="hidden" name="_captcha" value="false">
                    <input type="hidden" name="_template" value="table">
                    <input type="text" name="_honey" style="display:none" tabindex="-1" autocomplete="off">
                    <div class="form-group">
                        <label for="name">Your Name</label>
                        <input type="text" id="name" name="name" placeholder="John Doe" required>
                    </div>
                    <div class="form-group">
                        <label for="email">Your Email</label>
                        <input type="email" id="email" name="email" placeholder="john@example.com" required>
                    </div>
                    <div class="form-group">
                        <label for="message">Your Message</label>
                        <textarea id="message" name="message" placeholder="Tell me about your project..." rows="5" required></textarea>
                    </div>
                    <p class="form-status" hidden role="status"></p>
                    <button type="submit" class="btn btn-primary submit-btn">
                        <span>Send Message</span>
                        <i class="fas fa-paper-plane"></i>
                    </button>
                </form>
            </div>
        </div>
    </section>
